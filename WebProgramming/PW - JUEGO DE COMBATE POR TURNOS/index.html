<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Brainrot | Game</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <section id="ChooseChar">
        <h1>elige el personaje mas pro</h1>
    </section>

    <section id="CombatScreen">
        <div id="players">

            <div id="enemy-container">
                <img id="enemy-img" src="" alt="Imagen del Enemigo">
                <div class="hp-bar-wrapper">
                    <span class="hp-label">HP</span>
                    <div class="hp-bar-bg">
                        <div class="hp-bar-fill" id="enemy-hp-bar"></div>
                    </div>
                    <span class="hp-text" id="enemy-hp-text">100</span>
                </div>
                <p id="enemy-name"></p>
            </div>

            <div id="vs">
                <p>VS</p>
                <p id="battle-log"></p>
                <div id="win-counter-wrapper">
                    <p id="win-counter-text">VICTORIAS: 0</p>
                </div>
            </div>

            <div id="player-container">
                <img id="player-img" src="" alt="Imagen del Personaje">
                <div class="hp-bar-wrapper">
                    <span class="hp-label">HP</span>
                    <div class="hp-bar-bg">
                        <div class="hp-bar-fill" id="player-hp-bar"></div>
                    </div>
                    <span class="hp-text" id="player-hp-text">100</span>
                    
                </div>
                <p id="player-name"></p>
            </div>

        </div>

        <div id="actions">
        </div>
    </section>

    <section id="ResultsScreen">
        <div>
            <p id="results"></p>
            <img id="result-img" src="" alt="Imagen del Resultado">
            <div id="restart">Volver a jugar</div>
        </div>
    </section>

    <script src="script.js"></script>
</body>

</html>
